name: Update profile stats

on:
  schedule:
    - cron: "23 2 * * *" # Daily at 10:23 Asia/Shanghai.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/update-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Generate light stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide=issues,contribs&disable_animations=true&theme=default
          path: profile/stats.svg
          # A classic PAT with repo + read:user includes private statistics.
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          core_version: 2.2.0
          fail_on_error: true

      - name: Generate dark stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide=issues,contribs&disable_animations=true&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          core_version: 2.2.0
          fail_on_error: true

      - name: Commit updated cards
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("stats.svg", "stats-dark.svg"):
              path = Path("profile") / name
              lines = (line.rstrip() for line in path.read_text().splitlines())
              path.write_text("\n".join(lines).strip() + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/stats.svg profile/stats-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore(profile): refresh stats cards"
          git push origin "HEAD:$TARGET_BRANCH"
